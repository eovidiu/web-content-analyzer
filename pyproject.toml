[project]
name = "web-content-analyzer"
version = "0.1.0"
description = "CrewAI-based web content analysis agent that extracts keywords from web pages using Claude API"
readme = "README.md"
authors = [
    { name = "Ovidiu Eftimie", email = "oeftimie@adobe.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.65.2",
    "playwright>=1.40.0",
    "anthropic>=0.34.2",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "beautifulsoup4>=4.12.2",
    "pydantic>=2.5.0",
    "flask>=3.0.0",
]

[project.scripts]
web-analyzer = "web_content_analyzer.standalone_cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
